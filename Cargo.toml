[workspace]
resolver = "2"
members = ["crates/memdet", "crates/memdet-loco"]
# memdet-loco pulls the full loco-rs tree; keep it out of the fast inner loop.
# Build/test it explicitly with `-p memdet-loco`.
default-members = ["crates/memdet"]
# memdet-lints is a Dylint cdylib on a pinned nightly with its own [workspace];
# never build it as part of this one.
exclude = ["crates/memdet-lints"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yosefbennywidyo/memdet"
authors = ["Yosef Benny Widyokarsono <yosefbennywidyo@gmail.com>"]

[workspace.dependencies]
# Versions checked against crates.io on 2026-09-02; keep at latest stable.
memory-stats = "1.2.0"
tracing = { version = "0.1.44", default-features = false }
axum = { version = "0.8.9", default-features = false }
dhat = "0.3.3"
# loco-rs 1.x.
# default-features off so memdet-loco does not force loco's DB/queue backends
# back on for a consumer that opted out. The Initializer trait is unchanged
# between 0.16 and 1.x for the methods memdet-loco uses.
loco-rs = { version = "1", default-features = false }
async-trait = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
serial_test = "4.0.1"
tokio = { version = "1.53.1", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# reason: a small library re-uses its own type name in item names (RssBracket in rss.rs)
module_name_repetitions = "allow"
